---
name: Renovate

# Self-hosted Renovate, authenticated as the resim-renovate GitHub App.
#
# Cadence:
#   - The hourly cron picks up new vulnerability advisories within about an
#     hour. vulnerabilityAlerts in renovate.json sets `schedule: at any time`,
#     so security PRs open on the first run after an advisory is published.
#   - Other updates are gated by the top-level `schedule: before 5am on monday`
#     in renovate.json, so most hourly runs only rebase and merge open PRs.
#   - workflow_dispatch lets a person (or `gh workflow run`) trigger a run.

on:
  schedule:
    - cron: 45 * * * *
  workflow_dispatch:
    inputs:
      log-level:
        description: Renovate log level
        type: choice
        default: info
        options: [debug, info, warn, error]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: gha-small
    # The Renovate App's key is a secret of the renovate environment, which only
    # main may use, so a workflow on any other branch can't read it.
    environment:
      name: renovate
      deployment: false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Generate Renovate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: resim-ai
          repositories: |
            agent

      - name: Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: ${{ inputs.log-level || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_AUTODISCOVER: 'false'
          # gomodTidy needs a Go toolchain on PATH. `install` downloads the
          # version go.mod declares.
          RENOVATE_BINARY_SOURCE: install
